    <script type="module">
        import Handlebars from "https://cdn.jsdelivr.net/npm/handlebars@4.7.8/+esm";

        Handlebars.registerHelper("calculateAge", function (birthDate) {
            var today = new Date();
            var birthDate = new Date(birthDate);
            var age = today.getFullYear() - birthDate.getFullYear();
            var m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        });

        Handlebars.registerHelper("lt", function (a, b) {
            return a < b;
        });

        Handlebars.registerHelper("glte", function (a, b, c) {
            return a >= b && a <= c;
        });

        document.body.innerHTML = Handlebars.compile(template.innerHTML)(
            JSON.parse(data.innerHTML)
        );
    </script>
